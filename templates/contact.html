{% extends "headerfooter.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-center text-success fw-bold">Contact Us</h2>
    <p class="text-center text-muted">We'd love to hear from you! Fill out the form below.</p>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg p-4 border-0 rounded-4">
                <form method="POST" action="{% url 'contact' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Name</label>
                        <input type="text" class="form-control rounded-pill" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control rounded-pill" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="contact" class="form-label fw-semibold">Contact Number</label>
                        <input type="tel" class="form-control rounded-pill" id="contact" name="contact" required>
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label fw-semibold">Subject</label>
                        <input type="text" class="form-control rounded-pill" id="subject" name="subject" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label fw-semibold">Message</label>
                        <textarea class="form-control rounded-4" id="message" name="message" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold shadow-sm" 
                        style="transition: 0.3s ease;" 
                        onmouseover="this.style.backgroundColor='#0a7d5c'" 
                        onmouseout="this.style.backgroundColor='#198754'">
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
